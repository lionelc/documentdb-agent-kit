# expected-findings.yaml — determinism (Loop A)
#
# Contract: every diagnostic script, given the SAME database state, must return
# the SAME `--json` result on repeated runs.
#
# Determinism is asserted on `--json` only. The human-readable output embeds a
# wall-clock banner (`Timestamp: ...`) and measured latencies, so it is not — and
# should not be — byte-stable.
#
# Scope of the guarantee: a FIXED database state. Some findings legitimately
# depend on live PostgreSQL counters (e.g. `idx_scan`, which resets when the
# container restarts), so this scenario seeds its own database and does not
# exercise it between the repeated runs.

database: test_determinism

# How many times each script is run and compared. All runs must agree.
runs: 3

# Scripts under test. `must_find` = the canonicalised output must be non-empty
# (i.e. the script actually reported something). Without this guard a script that
# finds NOTHING would trivially "pass" determinism — the false-determinism trap.
scripts:
  - name: index-redundancy-finder.sh
    must_find: true
  - name: data-integrity-check.sh
    must_find: true
  - name: document-bloat-advisor.sh
    must_find: true
  - name: perf-advisor.sh
    must_find: true
  - name: db-config-advisor.sh
    must_find: true

# ---------------------------------------------------------------------------
# Volatile fields — MEASURED, not guessed.
#
# These keys hold live measurements that legitimately change between two runs
# against an unchanged database. They are removed before comparison. Everything
# else must be byte-stable; unexplained drift fails the test loudly.
#
# Observed drift that motivated each entry (perf-advisor.sh --json, two
# consecutive runs on an unchanged DB):
#   slow_queries[].ms          57 -> 61,  473 -> 452,  429 -> 309,  174 -> 168
#   pg.cache_top[].idx_hit_pct 95.65 -> 96.43,  98.55 -> 98.70
#   pg.scan_mix[].seq_scan     85 -> 93   (and idx_scan / idx_scan_pct with it)
#
# Keep this list SHORT and reviewed. Growing it silently is how a real
# nondeterminism bug gets hidden.
# ---------------------------------------------------------------------------
volatile_fields:
  # wall-clock / duration
  - timestamp
  - generated_at
  - duration_ms
  - elapsed_ms
  - ms
  # PostgreSQL live counters and ratios
  - seq_scan
  - idx_scan
  - idx_scan_pct
  - heap_hit_pct
  - idx_hit_pct
  - heap_disk_reads
  - numBlocksFromCache
  - numBlocksFromDisk
  # THIRD KNOWN LIMITATION (found when the suite first ran as part of the full
  # test run rather than in isolation): `perf-advisor.sh` builds `slow_queries`
  # by TIMING queries against a threshold, so it is not just the `ms` value that
  # moves — WHICH queries qualify changes with cache warmth and machine load.
  # Two runs of the same database disagreed on the membership (and therefore on
  # `summary.slow_queries`). The structural findings perf-advisor reports —
  # collections, index_health and the `collscans` patterns — remain asserted.
  # This key removes both the list and the summary count (same key name).
  - slow_queries

# Lists whose ORDER is derived from a volatile metric (they are sorted by a live
# counter, so two runs can legitimately order them differently). Such lists are
# order-normalised before comparison; their *contents* still must match.
#
# Observed: pg.scan_mix reordered between runs (reviews/inventory swapped) purely
# because their seq_scan counters crossed over.
order_insensitive_lists:
  - cache_top
  - scan_mix

# ---------------------------------------------------------------------------
# Sampled count maps — {category: count} produced by a RANDOM sample.
#
# KNOWN LIMITATION (found by this very suite on its first run):
# `data-integrity-check.sh` determines field-type consistency with
# `$sample` (`{$sample:{size:20}}` and `{$sample:{size:min(100,count)}}`),
# which draws a DIFFERENT random subset each run. Two consecutive runs on an
# unchanged database reported:
#     invoices.amount  {"number": 87, "string": 13}
#     invoices.amount  {"number": 85, "string": 15}
#
# The *finding* is stable and correct — `amount` really does hold both numbers
# and strings — but the sampled counts are not. So the category KEYS are
# asserted (they are the finding) and the counts are blanked.
#
# FOLLOW-UP (tracked, not silently accepted): make the sampling deterministic
# — e.g. sort by _id and take the first N, or scan the whole collection for
# small ones — so the counts become stable too. Until then this normalisation
# documents exactly what is and is not guaranteed.
# ---------------------------------------------------------------------------
sampled_count_maps:
  - types

# ---------------------------------------------------------------------------
# Sampled size strings — a summary string containing sampled byte sizes.
#
# SECOND KNOWN LIMITATION (also found by this suite on first use):
# `document-bloat-advisor.sh` derives `dominant_fields` from a document
# *sample*, so average field sizes wobble:
#     "body:4002B,notes:2002B,title:13B"
#     "body:4002B,notes:2002B,title:12B"
#
# The finding — which fields dominate, and in what order (body > notes > title,
# hence recommended_split_field: body) — is stable and is still asserted. Only
# the sampled byte numbers are blanked.
#
# FOLLOW-UP: same fix as above — deterministic sampling would stabilise these.
# ---------------------------------------------------------------------------
sampled_size_strings:
  - dominant_fields
